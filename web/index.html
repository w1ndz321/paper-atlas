<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="按研究主题查阅论文的方法、结果和主要贡献。"
    />
    <meta name="color-scheme" content="light" />
    <title>Paper Atlas · 已读论文库</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6.5' y='5' width='16.5' height='21' rx='3.5' transform='rotate(-10 16 16)' fill='%23c5d9f6'/%3E%3Crect x='9' y='5.5' width='17' height='21.5' rx='3.5' fill='%231956b4'/%3E%3Cpath d='M17.5 10.5c.35 3.35 1.9 4.9 5.25 5.25-3.35.35-4.9 1.9-5.25 5.25-.35-3.35-1.9-4.9-5.25-5.25 3.35-.35 4.9-1.9 5.25-5.25Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-left">
        <button
          id="sidebar-toggle"
          class="icon-button"
          type="button"
          aria-controls="sidebar-content"
          aria-expanded="true"
          aria-label="展开或收起分类目录"
          data-i18n-aria="展开或收起分类目录"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <a class="brand" href="./" aria-label="Paper Atlas 首页" data-i18n-aria="Paper Atlas 首页">
          <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="atlas-mark-grad" x1="9" y1="5.5" x2="26" y2="27" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2568d1" />
                <stop offset="100%" stop-color="#134491" />
              </linearGradient>
            </defs>
            <rect
              x="6.5"
              y="5"
              width="16.5"
              height="21"
              rx="3.5"
              transform="rotate(-10 16 16)"
              fill="#c5d9f6"
            />
            <rect
              x="9"
              y="5.5"
              width="17"
              height="21.5"
              rx="3.5"
              fill="url(#atlas-mark-grad)"
            />
            <path
              d="M17.5 10.5c.35 3.35 1.9 4.9 5.25 5.25-3.35.35-4.9 1.9-5.25 5.25-.35-3.35-1.9-4.9-5.25-5.25 3.35-.35 4.9-1.9 5.25-5.25Z"
              fill="#ffffff"
            />
          </svg>
          <span>Paper Atlas</span>
        </a>
      </div>
      <div class="header-links">
        <button id="language-toggle" type="button" aria-label="Switch to English" lang="en">EN</button>
        <button id="header-help" type="button" data-i18n="使用说明">使用说明</button>
        <a
          id="repo-link"
          class="repo"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="主题与分类目录" data-i18n-aria="主题与分类目录">
        <div id="sidebar-content" class="sidebar-content">
          <nav id="topics" aria-label="研究主题与分类维度" data-i18n-aria="研究主题与分类维度"></nav>
          <nav id="collections" aria-label="专题与兴趣探索" data-i18n-aria="专题与兴趣探索"></nav>
        </div>
      </aside>
      <main>
        <section id="library" aria-label="论文列表" data-i18n-aria="论文列表">
          <form id="search-form" class="search" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.7" cy="10.7" r="6.6"></circle>
              <path d="m16 16 4.5 4.5"></path></svg
            ><input
              id="search"
              type="search"
              placeholder="搜索问题、方法、指标或结论…"
              data-i18n-placeholder="搜索问题、方法、指标或结论…"
              aria-label="搜索论文全文卡片"
              data-i18n-aria="搜索论文全文卡片"
              autocomplete="off"
            /><button id="clear-search" type="button" class="clear-search" data-i18n="清空" hidden>清空</button><kbd>/</kbd>
          </form>
          <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置" data-i18n-aria="当前位置"></nav>
          <section
            id="topic-guide"
            class="topic-guide"
            aria-label="主题导读"
            data-i18n-aria="主题导读"
            hidden
          ></section>
          <div id="list-controls">
            <div class="toolbar">
              <div class="result-summary">
                <span id="active-label">全部论文</span>
                <span id="total" class="total" aria-live="polite"></span>
              </div>
              <div class="list-filters">
                <div class="filter-field"><label for="read-status" data-i18n="整理状态">整理状态</label><select id="read-status">
                  <option value="" data-i18n="全部内容">全部内容</option>
                  <option value="card" data-i18n="精读卡片">精读卡片</option>
                  <option value="reference" data-i18n="文献索引">文献索引</option>
                </select></div>
                <div class="filter-field"><label for="type-filter" data-i18n="文章类型">文章类型</label
                ><select id="type-filter">
                  <option value="">全部类型</option></select></div
                ><div class="filter-field"><label for="sort" data-i18n="排序">排序</label
                ><select id="sort">
                  <option value="added" data-i18n="最近收录">最近收录</option>
                  <option value="year" data-i18n="发表年份">发表年份</option>
                  <option value="title" data-i18n="标题排序">标题排序</option>
                </select></div>
              </div>
            </div>
          </div>
          <div class="list-context"><p id="reading-summary" class="reading-summary"></p><button type="button" id="reset-filters" data-i18n="重置筛选" hidden>重置筛选</button></div>
          <p id="feedback" role="status" class="feedback">正在读取知识库…</p>
          <div id="papers" class="paper-list"></div>
          <footer id="footer" data-i18n="按主题查阅论文的方法、结果与主要贡献。">按主题查阅论文的方法、结果与主要贡献。</footer>
        </section>
        <article id="reader" hidden aria-label="论文详情" data-i18n-aria="论文详情"></article>
      </main>
    </div>
    <dialog id="help">
      <button id="close-help" class="close" aria-label="关闭" data-i18n-aria="关闭">×</button>
      <p class="eyebrow" data-i18n="论文收录">论文收录</p>
      <h2 data-i18n="在 Codex 中开始。">在 Codex 中开始。</h2>
      <p data-i18n="在 Codex 中打开这个仓库，上传 PDF 或提供论文链接，然后说：">在 Codex 中打开这个仓库，上传 PDF 或提供论文链接，然后说：</p>
      <blockquote data-i18n="阅读这篇论文，按仓库规范收录并同步到 GitHub。">阅读这篇论文，按仓库规范收录并同步到 GitHub。</blockquote>
      <p data-i18n="Codex 会阅读全文、整理关键信息，并更新这里的索引。无需另外写笔记，也无需配置模型 API。">
        Codex
        会阅读全文、整理关键信息，并更新这里的索引。无需另外写笔记，也无需配置模型
        API。
      </p>
      <p>
        <a id="readme-link" target="_blank" rel="noopener noreferrer" data-i18n="查看仓库说明 ↗"
          >查看仓库说明 ↗</a
        >
      </p>
    </dialog>
    <script src="locale.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
