<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="按研究主题查阅论文的方法、结果和主要贡献。"
    />
    <meta name="color-scheme" content="light" />
    <title>Paper Atlas · 已读论文库</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Paper Atlas 首页">
        <svg class="mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <path
            d="M14 7.5C10.8 5.5 7.2 5.3 3.5 6.5v16c3.7-1.2 7.3-1 10.5 1 3.2-2 6.8-2.2 10.5-1v-16C20.8 5.3 17.2 5.5 14 7.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M14 7.5v16M7 10.5l3.5.5M7 14.5l3.5.5M17.5 11l3.5-.5M17.5 15l3.5-.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <span>Paper Atlas</span>
      </a>
      <div class="header-links">
        <button
          id="sidebar-toggle"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          分类
        </button>
        <button id="header-help">使用说明</button
        ><a
          id="repo-link"
          class="repo"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="主题与分类目录">
        <nav id="topics" aria-label="研究主题与分类维度"></nav>
        <nav id="collections" aria-label="专题与兴趣探索"></nav>
      </aside>
      <main>
        <section id="library" aria-label="论文列表">
          <form id="search-form" class="search" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.7" cy="10.7" r="6.6"></circle>
              <path d="m16 16 4.5 4.5"></path></svg
            ><input
              id="search"
              type="search"
              placeholder="搜索问题、方法、指标或结论…"
              aria-label="搜索论文全文卡片"
              autocomplete="off"
            /><kbd>/</kbd>
          </form>
          <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置"></nav>
          <section
            id="topic-guide"
            class="topic-guide"
            aria-label="主题导读"
            hidden
          ></section>
          <div id="list-controls">
            <div class="toolbar">
              <div class="result-summary">
                <span id="active-label">全部论文</span>
                <span id="total" class="total" aria-live="polite"></span>
              </div>
              <div>
                <label class="sr-only" for="type-filter">文章类型</label
                ><select id="type-filter">
                  <option value="">全部类型</option></select
                ><label class="sr-only" for="sort">排序</label
                ><select id="sort">
                  <option value="added">最近收录</option>
                  <option value="year">发表年份</option>
                  <option value="title">标题排序</option>
                </select>
              </div>
            </div>
          </div>
          <p id="feedback" role="status" class="feedback">正在读取知识库…</p>
          <div id="papers" class="paper-list"></div>
          <footer id="footer">按主题查阅论文的方法、结果与主要贡献。</footer>
        </section>
        <article id="reader" hidden aria-label="论文详情"></article>
      </main>
    </div>
    <dialog id="help">
      <button id="close-help" class="close" aria-label="关闭">×</button>
      <p class="eyebrow">论文收录</p>
      <h2>在 Codex 中开始。</h2>
      <p>在 Codex 中打开这个仓库，上传 PDF 或提供论文链接，然后说：</p>
      <blockquote>阅读这篇论文，按仓库规范收录并同步到 GitHub。</blockquote>
      <p>
        Codex
        会阅读全文、整理关键信息，并更新这里的索引。无需另外写笔记，也无需配置模型
        API。
      </p>
      <p>
        <a id="readme-link" target="_blank" rel="noopener noreferrer"
          >查看仓库说明 ↗</a
        >
      </p>
    </dialog>
    <script src="app.js" defer></script>
  </body>
</html>
